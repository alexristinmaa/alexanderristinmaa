name: Deploy to Firebase Hosting on merge
'on':
  schedule:
     - cron: "30 21 * * *"
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.5'
      - run: |
          touch .env
          echo LEKAOS_EMAIL=${{ secrets.LEKAOS_EMAIL }} >> .env
          echo LEKAOS_PASSWORD=${{ secrets.LEKAOS_PASSWORD }} >> .env
          echo LEKAOS_APITOKEN=${{ secrets.LEKAOS_APITOKEN }} >> .env
      - run: go run main.go && mv ranking.json alexanderristinmaa/public/ranking/ranking.json
      - run: npm ci --prefix alexanderristinmaa/ && npm run build --prefix alexanderristinmaa/
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_ALEXANDERRISTINMAA_F09CD }}'
          channelId: live
          projectId: alexanderristinmaa-f09cd
